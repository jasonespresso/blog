<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polaroid Frame</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: 2.5rem;
    padding: 3rem 2rem;
    background: #e8e5df;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .polaroid {
    background: #fdfdfb;
    padding: 1rem 1rem 3.5rem;
    box-shadow:
      0 1px 2px rgba(0,0,0,0.08),
      0 8px 16px rgba(0,0,0,0.12);
    width: 260px;
    max-width: 85vw;
    transform: rotate(var(--tilt, 0deg));
    transition: transform 0.2s ease;
  }

  @media (max-width: 420px) {
    body {
      gap: 2rem;
      padding: 2rem 1rem;
    }
    .polaroid {
      width: 100%;
      max-width: 320px;
    }
    .polaroid:hover {
      transform: rotate(var(--tilt, 0deg)); /* no hover scale on touch */
    }
  }

  .polaroid:hover {
    transform: rotate(0deg) scale(1.02);
  }

  .polaroid .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #d8d5cd; /* placeholder tone if no image loads */
  }

  .polaroid .caption {
    display: block;
    text-align: center;
    margin-top: 1rem;
    font-size: 0.95rem;
    color: #3a3a38;
    font-family: "Segoe Print", "Bradley Hand", cursive, sans-serif;
  }

  .polaroid.tilt-left  { --tilt: -4deg; }
  .polaroid.tilt-right { --tilt: 3deg; }
</style>
</head>
<body>

  <figure class="polaroid tilt-left">
    <img class="photo" src="https://picsum.photos/seed/1/500/500" alt="">
    <figcaption class="caption">summer, 2024</figcaption>
  </figure>

  <figure class="polaroid">
    <img class="photo" src="https://picsum.photos/seed/2/500/500" alt="">
    <figcaption class="caption">the lake house</figcaption>
  </figure>

  <figure class="polaroid tilt-right">
    <img class="photo" src="https://picsum.photos/seed/3/500/500" alt="">
    <figcaption class="caption">good ones</figcaption>
  </figure>

</body>
</html>
